<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi - Validasi</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }
        .card {
            width: min(100%, 440px);
            padding: 28px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
        }
        h1 { margin: 0 0 8px; font-size: 1.6rem; }
        .intro { margin: 0 0 22px; color: #6b7280; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input:not([type="checkbox"]) {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font: inherit;
        }
        input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
        input[aria-invalid="true"] { border-color: #dc2626; }
        .error { min-height: 18px; margin: 5px 0 0; color: #b91c1c; font-size: .875rem; }
        .checkbox-row { display: flex; align-items: flex-start; gap: 9px; }
        .checkbox-row label { margin: 0; font-weight: 400; }
        button {
            width: 100%; padding: 12px; border: 0; border-radius: 7px;
            background: #2563eb; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        #result { margin: 16px 0 0; font-weight: 600; }
        #result.success { color: #15803d; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Daftar Akun</h1>
        <p class="intro">Lengkapi data berikut untuk membuat akun.</p>

        <form id="registrationForm" novalidate>
            <div class="field">
                <label for="nama">Nama lengkap</label>
                <input id="nama" name="nama" type="text" autocomplete="name" aria-describedby="namaError">
                <p class="error" id="namaError"></p>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" aria-describedby="emailError">
                <p class="error" id="emailError"></p>
            </div>

            <div class="field">
                <label for="password">Kata sandi</label>
                <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="passwordError">
                <p class="error" id="passwordError"></p>
            </div>

            <div class="field">
                <label for="konfirmasi">Konfirmasi kata sandi</label>
                <input id="konfirmasi" name="konfirmasi" type="password" autocomplete="new-password" aria-describedby="konfirmasiError">
                <p class="error" id="konfirmasiError"></p>
            </div>

            <div class="field">
                <div class="checkbox-row">
                    <input id="persetujuan" name="persetujuan" type="checkbox" aria-describedby="persetujuanError">
                    <label for="persetujuan">Saya menyetujui syarat dan ketentuan.</label>
                </div>
                <p class="error" id="persetujuanError"></p>
            </div>

            <button type="submit">Buat akun</button>
            <p id="result" role="status" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const form = document.getElementById('registrationForm');
        const result = document.getElementById('result');
        const fields = ['nama', 'email', 'password', 'konfirmasi'];

        function setError(fieldId, message) {
            const input = document.getElementById(fieldId);
            document.getElementById(`${fieldId}Error`).textContent = message;
            input.setAttribute('aria-invalid', message ? 'true' : 'false');
        }

        function validateForm() {
            const nama = document.getElementById('nama').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const konfirmasi = document.getElementById('konfirmasi').value;
            const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            let valid = true;

            setError('nama', nama ? '' : 'Nama lengkap wajib diisi.');
            setError('email', !email ? 'Email wajib diisi.' : (!emailValid ? 'Format email tidak valid.' : ''));
            setError('password', !password ? 'Kata sandi wajib diisi.' : (password.length < 8 ? 'Kata sandi minimal 8 karakter.' : ''));
            setError('konfirmasi', !konfirmasi ? 'Konfirmasi kata sandi wajib diisi.' : (konfirmasi !== password ? 'Konfirmasi kata sandi tidak cocok.' : ''));

            const agreed = document.getElementById('persetujuan').checked;
            document.getElementById('persetujuanError').textContent = agreed ? '' : 'Persetujuan wajib dicentang.';

            for (const field of fields) {
                if (document.getElementById(`${field}Error`).textContent) valid = false;
            }
            if (!agreed) valid = false;
            return valid;
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            result.textContent = '';
            result.classList.remove('success');

            if (validateForm()) {
                result.textContent = 'Validasi berhasil. Form siap dikirim.';
                result.classList.add('success');
            }
        });

        fields.forEach((field) => {
            document.getElementById(field).addEventListener('input', () => {
                if (result.textContent) result.textContent = '';
                validateForm();
            });
        });
        document.getElementById('persetujuan').addEventListener('change', validateForm);
    </script>
</body>
</html>
